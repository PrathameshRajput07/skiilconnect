services:
  - type: web
    name: skillconnect-backend
    env: node
    plan: free
    rootDir: skillconnect/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://skiilconnect-qz4w-git-main-prathameshrajput07s-projects.vercel.app
